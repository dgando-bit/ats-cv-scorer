services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app          # hot-reload du code en dev
      - model_cache:/root/.cache        # cache des modèles HuggingFace / sentence-transformers
    environment:
      - HF_HOME=/root/.cache/huggingface
      - ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src         # hot-reload du code en dev
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_cache:
    driver: local
